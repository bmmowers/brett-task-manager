<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brett Mowers — Action Items</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --dark: #1a1a1a;
    --red: #8B1A1A;
    --red-light: #fef2f2;
    --orange: #c2410c;
    --blue: #0369a1;
    --gray: #4b5563;
    --border: #e5e7eb;
    --muted: #9ca3af;
    --text: #374151;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Source Sans 3', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--bg); color: var(--dark); min-height: 100vh; font-size: 15px; }

  .header { background: var(--dark); color: #f5f4f0; padding: 20px 24px 16px; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--red); }
  .header-inner { max-width: 780px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .header-eyebrow { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .header-title { font-family: var(--font-display); font-size: 22px; font-weight: 400; letter-spacing: -0.3px; }
  .header-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .btn-add { background: var(--red); color: #fff; border: none; padding: 9px 18px; font-size: 12px; font-family: var(--font-body); font-weight: 600; cursor: pointer; letter-spacing: 0.5px; white-space: nowrap; transition: background 0.2s; flex-shrink: 0; }
  .btn-add:hover { background: #6b1414; }
  .btn-add.cancel { background: var(--gray); }

  .filter-bar { background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .filter-bar-inner { max-width: 780px; margin: 0 auto; display: flex; padding: 0 24px; }
  .filter-btn { padding: 11px 14px; border: none; border-bottom: 2px solid transparent; background: transparent; cursor: pointer; font-size: 11px; letter-spacing: 0.5px; color: var(--muted); font-family: var(--font-body); white-space: nowrap; transition: all 0.15s; }
  .filter-btn.active { color: var(--red); border-bottom-color: var(--red); font-weight: 600; }
  .filter-btn .count { font-size: 10px; color: var(--muted); margin-left: 4px; }

  .add-form { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: none; }
  .add-form.open { display: block; }
  .add-form-inner { max-width: 780px; margin: 0 auto; }
  .form-grid { display: grid; gap: 10px; }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .form-input { padding: 9px 12px; border: 1px solid var(--border); font-size: 13px; font-family: var(--font-body); width: 100%; outline: none; transition: border-color 0.15s; background: var(--bg); }
  .form-input:focus { border-color: var(--red); }
  .form-input.flex1 { flex: 1; width: auto; }
  select.form-input { width: auto; }
  .btn-submit { background: var(--dark); color: #fff; border: none; padding: 9px 22px; font-size: 12px; font-family: var(--font-body); font-weight: 600; cursor: pointer; }
  .btn-submit:hover { background: #333; }

  .main { max-width: 780px; margin: 0 auto; padding: 20px 24px 60px; }

  .bucket { margin-bottom: 28px; }
  .bucket-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bucket-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #fff; padding: 3px 12px; font-family: var(--font-body); font-weight: 600; flex-shrink: 0; }
  .bucket-line { height: 1px; flex: 1; }
  .bucket-count { font-size: 10px; color: var(--muted); flex-shrink: 0; }

  .item { background: var(--surface); border: 1px solid var(--border); border-left-width: 3px; margin-bottom: 5px; transition: opacity 0.35s ease, transform 0.35s ease; }
  .item.overdue { background: #fffbfb; }
  .item.important { background: #fffbeb; border-color: #f59e0b; }
  .item.important.overdue { background: #fff7ed; }
  .item.completing { opacity: 0; transform: translateX(16px); }
  .important-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 0 2px; margin-top: 1px; opacity: 0.25; transition: opacity 0.15s, transform 0.15s; flex-shrink: 0; line-height: 1; }
  .important-btn:hover { opacity: 0.6; transform: scale(1.2); }
  .important-btn.flagged { opacity: 1; }
  .badge-important { background: #f59e0b; color: #fff; font-size: 10px; padding: 2px 7px; font-weight: 600; letter-spacing: 0.5px; }
  .item-row { display: flex; align-items: flex-start; padding: 11px 13px; gap: 11px; }
  .item-check { width: 17px; height: 17px; min-width: 17px; border: 1.5px solid var(--border); background: #fff; cursor: pointer; margin-top: 2px; transition: all 0.15s; appearance: none; -webkit-appearance: none; flex-shrink: 0; }
  .item-check:hover { border-color: var(--red); background: var(--red-light); }
  .item-body { flex: 1; min-width: 0; }
  .item-text { font-size: 13px; line-height: 1.45; color: var(--dark); cursor: pointer; user-select: none; }
  .item-text .toggle-icon { font-size: 9px; color: var(--muted); margin-left: 5px; }
  .item-detail { font-size: 12px; color: #6b7280; margin-top: 5px; line-height: 1.5; display: none; }
  .item-detail.open { display: block; }
  .item-due { font-size: 10px; margin-top: 3px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .item-due:hover { text-decoration: underline; }
  .item-due.overdue { color: #dc2626; font-weight: 600; }
  .item-due.today { color: #ea580c; font-weight: 600; }
  .item-due.upcoming { color: var(--muted); }
  .item-due-input { font-size: 10px; font-family: var(--font-body); border: 1px solid #f59e0b; padding: 1px 4px; margin-top: 3px; outline: none; background: #fffbeb; color: var(--dark); cursor: pointer; }
  .item-no-date { font-size: 10px; color: #d1d5db; margin-top: 3px; cursor: pointer; }
  .item-no-date:hover { color: var(--muted); text-decoration: underline; }
  .item-meta { display: flex; gap: 5px; align-items: flex-start; flex-direction: column; flex-shrink: 0; align-items: flex-end; }
  .badge { font-size: 10px; padding: 2px 7px; white-space: nowrap; font-family: var(--font-body); }
  .badge-delegate { background: #f3f4f6; color: #6b7280; }
  .badge-tag { border: 1px solid; }

  .empty { text-align: center; padding: 50px 0; color: var(--muted); font-size: 13px; font-family: var(--font-display); font-style: italic; }

  .completed-section { margin-top: 36px; border-top: 1px solid var(--border); padding-top: 20px; }
  .completed-toggle { background: none; border: none; cursor: pointer; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: var(--font-body); padding: 0; margin-bottom: 14px; }
  .completed-list { display: none; }
  .completed-list.open { display: flex; flex-direction: column; gap: 4px; }
  .completed-item { background: #f9fafb; border: 1px solid var(--border); padding: 9px 13px; display: flex; align-items: center; gap: 10px; }
  .completed-text { font-size: 12px; color: var(--muted); text-decoration: line-through; flex: 1; }
  .completed-date { font-size: 10px; color: #d1d5db; flex-shrink: 0; }
  .btn-restore, .btn-delete-c { font-size: 11px; background: none; padding: 2px 7px; cursor: pointer; font-family: var(--font-body); flex-shrink: 0; }
  .btn-restore { color: #6b7280; border: 1px solid var(--border); }
  .btn-delete-c { color: #dc2626; border: 1px solid #fca5a5; }

  .loading { display: flex; align-items: center; justify-content: center; height: 60vh; font-family: var(--font-display); color: var(--muted); font-style: italic; }
  .export-btn { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 6px 14px; cursor: pointer; font-family: var(--font-body); letter-spacing: 0.5px; margin-top: 32px; display: block; transition: all 0.15s; }
  .export-btn:hover { border-color: var(--dark); color: var(--dark); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--dark); color: #fff; padding: 10px 20px; font-size: 12px; font-family: var(--font-body); opacity: 0; transition: all 0.3s ease; z-index: 999; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .header-title { font-size: 18px; }
    .main { padding: 16px 16px 60px; }
    .header { padding: 16px 16px 12px; }
    .filter-bar-inner { padding: 0 16px; }
    .add-form { padding: 14px 16px; }
    .item-meta { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-eyebrow">River Valley Holdings</div>
      <div class="header-title">Brett Mowers — Action Items</div>
      <div class="header-meta" id="header-meta">Loading...</div>
    </div>
    <button class="btn-add" id="btn-add" onclick="toggleForm()">+ Add Item</button>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-bar-inner" id="filter-bar"></div>
</div>

<div class="add-form" id="add-form">
  <div class="add-form-inner">
    <div class="form-grid">
      <input class="form-input" id="f-text" placeholder="Item text *" />
      <input class="form-input" id="f-detail" placeholder="Detail / context (optional)" />
      <div class="form-row">
        <input class="form-input flex1" id="f-due" type="date" title="Due date (optional)" />
        <input class="form-input flex1" id="f-tag" placeholder="Tag (e.g. Freezer, SQF 10)" />
        <select class="form-input" id="f-own" onchange="toggleDelegate()">
          <option value="own">Own</option>
          <option value="delegate">Delegate</option>
        </select>
        <input class="form-input flex1" id="f-delegate" placeholder="Delegate to..." style="display:none" />
      </div>
      <div>
        <button class="btn-submit" onclick="addItem()">Add Item</button>
      </div>
    </div>
  </div>
</div>

<div class="main" id="main">
  <div class="loading">Loading your items...</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://yknfimksrhvtsyebwfqs.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrbmZpbWtzcmh2dHN5ZWJ3ZnFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjUzNzQsImV4cCI6MjA5NTkwMTM3NH0.2E9fmmMWBcoQ-2z69GuuvEahjXZFnDvcsOqnl2bU1zQ';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const TAG_COLORS = {
  'Contract Service Provider': '#7c3aed', 'S&D Dry': '#b45309', 'Lead Development': '#0e7490',
  'Mock Crisis': '#be123c', 'SQF 10': '#166534', 'Freezer': '#1e40af', 'Safety': '#92400e',
  'DCN Strategy': '#4338ca', 'CSP / DCN': '#5b21b6', 'Lead Dev': '#0e7490',
};
function tagColor(tag) { return TAG_COLORS[tag] || '#6b7280'; }

const today = new Date(); today.setHours(0,0,0,0);

function dueMeta(due_date) {
  if (!due_date) return null;
  const d = new Date(due_date + 'T00:00:00');
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0) return { label: `Overdue · ${fmtDate(d)}`, cls: 'overdue' };
  if (diff === 0) return { label: `Due today`, cls: 'today' };
  if (diff === 1) return { label: `Due tomorrow`, cls: 'upcoming' };
  return { label: `Due ${fmtDate(d)}`, cls: 'upcoming' };
}

function fmtDate(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function isOverdue(due_date) {
  if (!due_date) return false;
  const d = new Date(due_date + 'T00:00:00');
  return d < today;
}

let allItems = [];
let completedItems = [];
let currentFilter = 'All';
let showCompleted = false;
let formOpen = false;

// Bucket logic based on due_date
function getBucket(item) {
  if (!item.due_date) return 'No Date';
  const d = new Date(item.due_date + 'T00:00:00');
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0) return 'Overdue';
  if (diff <= 3) return 'This Week';
  // This Month = same calendar month and year as today
  if (d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear()) return 'This Month';
  // Next Month
  const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
  const monthAfter = new Date(today.getFullYear(), today.getMonth() + 2, 1);
  if (d >= nextMonth && d < monthAfter) return 'Next Month';
  return 'Upcoming';
}

const BUCKET_ORDER = ['Overdue', 'This Week', 'This Month', 'Next Month', 'Upcoming', 'No Date'];
const BUCKET_COLORS = {
  'Overdue':    { bg: '#dc2626', border: '#fca5a5' },
  'This Week':  { bg: '#ea580c', border: '#fdba74' },
  'This Month': { bg: '#0369a1', border: '#7dd3fc' },
  'Next Month': { bg: '#0e7490', border: '#a5f3fc' },
  'Upcoming':   { bg: '#4b5563', border: '#d1d5db' },
  'No Date':    { bg: '#6b7280', border: '#e5e7eb' },
};

async function loadItems() {
  const { data, error } = await db
    .from('action_items')
    .select('*')
    .order('due_date', { ascending: true, nullsFirst: false });
  if (error) { console.error(error); return; }
  allItems = data.filter(i => !i.completed);
  completedItems = data.filter(i => i.completed).sort((a,b) => new Date(b.completed_at) - new Date(a.completed_at));
  render();
}

function filteredItems() {
  if (currentFilter === 'All') return allItems;
  if (currentFilter === 'Own') return allItems.filter(i => i.own);
  if (currentFilter === 'Delegate') return allItems.filter(i => !i.own);
  if (currentFilter === 'Overdue') return allItems.filter(i => isOverdue(i.due_date));
  if (currentFilter === 'Important') return allItems.filter(i => i.important);
  return allItems;
}

function render() { updateMeta(); renderFilters(); renderMain(); }

function updateMeta() {
  const own = allItems.filter(i => i.own).length;
  const del = allItems.filter(i => !i.own).length;
  const overdue = allItems.filter(i => isOverdue(i.due_date)).length;
  let meta = `${allItems.length} open · ${own} own · ${del} delegate`;
  if (overdue > 0) meta += ` · ${overdue} overdue`;
  document.getElementById('header-meta').textContent = meta;
}

function renderFilters() {
  const overdue = allItems.filter(i => isOverdue(i.due_date)).length;
  const important = allItems.filter(i => i.important).length;
  const filters = ['All', 'Own', 'Delegate', overdue > 0 ? 'Overdue' : null, important > 0 ? 'Important' : null].filter(Boolean);
  const counts = {
    'All': allItems.length,
    'Own': allItems.filter(i=>i.own).length,
    'Delegate': allItems.filter(i=>!i.own).length,
    'Overdue': overdue,
    'Important': important,
  };
  document.getElementById('filter-bar').innerHTML = filters.map(f => `
    <button class="filter-btn ${currentFilter===f?'active':''}" onclick="setFilter('${f}')">
      ${f} <span class="count">(${counts[f]||0})</span>
    </button>
  `).join('');
}

function renderMain() {
  const fi = filteredItems();
  const grouped = {};
  BUCKET_ORDER.forEach(b => {
    const bi = fi.filter(i => getBucket(i) === b);
    if (bi.length) grouped[b] = bi;
  });

  let html = '';
  if (Object.keys(grouped).length === 0) html += '<div class="empty">No items in this view.</div>';

  Object.entries(grouped).forEach(([bucket, items]) => {
    const c = BUCKET_COLORS[bucket];
    html += `
      <div class="bucket">
        <div class="bucket-header">
          <div class="bucket-label" style="background:${c.bg}">${bucket}</div>
          <div class="bucket-line" style="background:${c.border}"></div>
          <div class="bucket-count">${items.length} item${items.length!==1?'s':''}</div>
        </div>
        <div>${items.map(item => renderItem(item, c)).join('')}</div>
      </div>`;
  });

  if (completedItems.length > 0) {
    html += `
      <div class="completed-section">
        <button class="completed-toggle" onclick="toggleCompleted()">
          ${showCompleted?'▼':'▶'} Completed (${completedItems.length})
        </button>
        <div class="completed-list ${showCompleted?'open':''}">
          ${completedItems.map(item => `
            <div class="completed-item">
              <span class="completed-text">${item.text}</span>
              <span class="completed-date">${new Date(item.completed_at).toLocaleDateString()}</span>
              <button class="btn-restore" onclick="restoreItem('${item.id}')">restore</button>
              <button class="btn-delete-c" onclick="deleteItem('${item.id}')">delete</button>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  html += `<button class="export-btn" onclick="exportForClaude()">↗ Export for Claude</button>`;
  document.getElementById('main').innerHTML = html;
}

function renderItem(item, c) {
  const hasDetail = item.detail && item.detail.trim();
  const tc = tagColor(item.tag);
  const due = dueMeta(item.due_date);
  const overdueCls = isOverdue(item.due_date) ? 'overdue' : '';
  const importantCls = item.important ? 'important' : '';
  const leftColor = item.important ? '#f59e0b' : (item.own ? c.bg : '#d1d5db');
  return `
    <div class="item ${overdueCls} ${importantCls}" id="item-${item.id}" style="border-left-color:${leftColor}">
      <div class="item-row">
        <input type="checkbox" class="item-check" onclick="completeItem('${item.id}')" title="Mark complete" />
        <div class="item-body">
          <div class="item-text" onclick="${hasDetail?`toggleDetail('${item.id}')`:''}" style="${hasDetail?'cursor:pointer':'cursor:default'}${item.important?';font-weight:600':''}">
            ${item.text}
            ${hasDetail?`<span class="toggle-icon" id="icon-${item.id}">▼</span>`:''}
          </div>
          ${due
            ? `<div class="item-due ${due.cls}" onclick="showDatePicker('${item.id}')" title="Click to change date">📅 ${due.label}</div>`
            : `<div class="item-no-date" onclick="showDatePicker('${item.id}')" title="Set a due date">+ set date</div>`}
          <input type="date" class="item-due-input" id="datepicker-${item.id}" style="display:none"
            value="${item.due_date || ''}"
            onchange="updateDate('${item.id}', this.value)"
            onblur="hideDatePicker('${item.id}')" />
          ${hasDetail?`<div class="item-detail" id="detail-${item.id}">${item.detail}</div>`:''}
        </div>
        <div class="item-meta">
          ${item.important?`<span class="badge badge-important">⚑ Important</span>`:''}
          ${!item.own?`<span class="badge badge-delegate">→ ${item.delegate||''}</span>`:''}
          ${item.tag?`<span class="badge badge-tag" style="color:${tc};border-color:${tc}30;background:${tc}10">${item.tag}</span>`:''}
        </div>
        <button class="important-btn ${item.important?'flagged':''}" onclick="toggleImportant('${item.id}', ${item.important})" title="${item.important?'Remove important flag':'Mark as important'}">⚑</button>
      </div>
    </div>`;
}

async function toggleImportant(id, current) {
  await db.from('action_items').update({ important: !current }).eq('id', id);
  await loadItems();
}

function showDatePicker(id) {
  const input = document.getElementById(`datepicker-${id}`);
  if (input) { input.style.display = 'block'; input.focus(); input.click(); }
}

function hideDatePicker(id) {
  const input = document.getElementById(`datepicker-${id}`);
  if (input) setTimeout(() => { input.style.display = 'none'; }, 200);
}

async function updateDate(id, newDate) {
  await db.from('action_items').update({ due_date: newDate || null }).eq('id', id);
  showToast('Date updated');
  await loadItems();
}

function toggleDetail(id) {
  const d = document.getElementById(`detail-${id}`);
  const icon = document.getElementById(`icon-${id}`);
  if (d) { d.classList.toggle('open'); icon.textContent = d.classList.contains('open')?'▲':'▼'; }
}

async function completeItem(id) {
  const el = document.getElementById(`item-${id}`);
  if (el) el.classList.add('completing');
  setTimeout(async () => {
    await db.from('action_items').update({ completed: true, completed_at: new Date().toISOString() }).eq('id', id);
    showToast('Done ✓');
    await loadItems();
  }, 350);
}

async function restoreItem(id) {
  await db.from('action_items').update({ completed: false, completed_at: null }).eq('id', id);
  await loadItems();
}

async function deleteItem(id) {
  await db.from('action_items').delete().eq('id', id);
  await loadItems();
}

async function addItem() {
  const text = document.getElementById('f-text').value.trim();
  if (!text) { document.getElementById('f-text').focus(); return; }
  const own = document.getElementById('f-own').value === 'own';
  const due = document.getElementById('f-due').value || null;
  await db.from('action_items').insert({
    text,
    detail: document.getElementById('f-detail').value.trim() || null,
    due_date: due,
    tag: document.getElementById('f-tag').value.trim() || null,
    own,
    delegate: own ? null : document.getElementById('f-delegate').value.trim() || null,
    sort_order: allItems.length + 1,
    completed: false,
  });
  document.getElementById('f-text').value = '';
  document.getElementById('f-detail').value = '';
  document.getElementById('f-due').value = '';
  document.getElementById('f-tag').value = '';
  toggleForm();
  showToast('Item added');
  await loadItems();
}

function setFilter(f) { currentFilter = f; render(); }
function toggleCompleted() { showCompleted = !showCompleted; renderMain(); }
function toggleDelegate() {
  document.getElementById('f-delegate').style.display =
    document.getElementById('f-own').value === 'delegate' ? 'block' : 'none';
}
function toggleForm() {
  formOpen = !formOpen;
  document.getElementById('add-form').classList.toggle('open', formOpen);
  document.getElementById('btn-add').textContent = formOpen ? '✕ Cancel' : '+ Add Item';
  document.getElementById('btn-add').classList.toggle('cancel', formOpen);
  if (formOpen) setTimeout(() => document.getElementById('f-text').focus(), 100);
}

function exportForClaude() {
  const byDate = [...allItems].sort((a,b) => {
    if (!a.due_date && !b.due_date) return 0;
    if (!a.due_date) return 1;
    if (!b.due_date) return -1;
    return new Date(a.due_date) - new Date(b.due_date);
  });
  const lines = ['# Brett Mowers — Action Items Export', `Generated: ${new Date().toLocaleString()}`, ''];
  BUCKET_ORDER.forEach(bucket => {
    const bi = byDate.filter(i => getBucket(i) === bucket);
    if (!bi.length) return;
    lines.push(`## ${bucket}`);
    bi.forEach(i => {
      const due = i.due_date ? ` · Due ${new Date(i.due_date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}` : '';
      lines.push(`- [ ] **${i.text}**${due}${i.detail?' — '+i.detail:''}${!i.own?' *(delegate: '+i.delegate+')*':''}${i.tag?' *('+i.tag+')*':''}`);
    });
    lines.push('');
  });
  navigator.clipboard.writeText(lines.join('\n')).then(() => showToast('Copied — paste into Claude'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && formOpen) addItem();
  if (e.key === 'Escape' && formOpen) toggleForm();
});

loadItems();
